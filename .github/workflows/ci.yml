name: gates
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      # shipprobe is the one dependency; playwright is the dev dependency the suite drives.
      - name: install
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: suite
        run: bash test/run.sh
      - name: demo is honest
        run: node bin/glanceless.mjs demo
